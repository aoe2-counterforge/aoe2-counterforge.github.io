<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta name="theme-color" content="#eff2f6" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#12100d" />
        <meta name="color-scheme" content="dark light" />
        <link rel="icon" type="image/svg+xml" href="/brand.svg" />
        <script>
            // The stylesheet dresses one theme at a time, so the choice is settled before the first
            // paint: the one the reader stored, else the one the system asks for.
            (function () {
                var choice = null;
                try {
                    choice = JSON.parse(localStorage.getItem('aoe2-guide.preferences') || '{}').theme;
                } catch (error) {
                    choice = null;
                }
                var dark = choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.dataset.theme = dark ? 'dark' : 'light';
            })();
        </script>
        <!--page-head-->
    </head>
    <body>
        <div id="root"><!--page-root--></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
